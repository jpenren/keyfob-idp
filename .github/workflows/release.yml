# Builds the release artifacts and publishes a GitHub Release when a version
# tag (v*) is pushed. Produces zip (Windows) and tar.gz (Linux, macOS) archives
# with the `keyfob` binary, plus the source archives and a SHA256SUMS file.
#
# Asset names are stable across releases (keyfob-linux-x86_64.tar.gz, ...), so
# https://github.com/jpenren/keyfob-idp/releases/latest/download/<asset> always
# resolves to the newest build. Versions stay visible inside the archive, whose
# directory is keyfob-<tag>-<target>.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-tag:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match Cargo.toml version '$version'. Bump the version or tag 'v$version'."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: keyfob-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: keyfob-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: keyfob-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: keyfob-macos-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows: zip via PowerShell, which is always present on the runner.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "keyfob-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/keyfob.exe" $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, examples/keyfob.minimal.yaml, examples/keyfob.full.yaml $stage
          Compress-Archive -Path $stage -DestinationPath "${{ matrix.asset }}.zip"

      # Linux and macOS: tar.gz.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="keyfob-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/keyfob" "$stage/"
          chmod +x "$stage/keyfob"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          cp examples/keyfob.minimal.yaml examples/keyfob.full.yaml "$stage/"
          tar -czf "${{ matrix.asset }}.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: keyfob-${{ matrix.target }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error

  source:
    name: Package sources
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create source archives
        shell: bash
        run: |
          stage="keyfob-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$stage/" HEAD | gzip -9 > keyfob-src.tar.gz
          git archive --format=zip --prefix="$stage/" HEAD > keyfob-src.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: keyfob-src
          path: keyfob-src.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
