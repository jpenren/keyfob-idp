<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out · keyfob-idp</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#1c1e21; --muted:#6b7280; --border:#e3e5e8; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#181c21; --fg:#e8eaed; --muted:#9aa4b2; --border:#2a2f36; --accent:#5b8def; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
           font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; }
    .card { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p { margin:0 0 12px; }
    .muted { color:var(--muted); font-size:14px; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Signed out</h1>
    <p>Your keyfob-idp session has ended.</p>
    {% if ui_enabled %}
      <p><a href="/">Back to the token generator</a></p>
    {% else %}
      <p class="muted">Issuer: <code>{{ issuer }}</code></p>
    {% endif %}
  </main>
</body>
</html>
